name: MondayCommandCenter
options:
  bundleIdPrefix: com.chris
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  MondayCommandCenter:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chris.commandcenter
        PRODUCT_NAME: Command Center
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Command Center
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "MONDAY Command Center can show today's calendar after you choose to connect it."
        OTHER_LDFLAGS: "-lsqlite3"
