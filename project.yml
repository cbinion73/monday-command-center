name: MondayCommandCenter
options:
  bundleIdPrefix: com.chris
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  MondayCommandCenter:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chris.commandcenter
        PRODUCT_NAME: Command Center
        CODE_SIGN_IDENTITY: "MONDAY Command Center Local"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Command Center
